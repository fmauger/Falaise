#@description A list of arbitrary particle generators
#@key_label  "name"
#@meta_label "type"

[name="electron.100keV" type="genbb::single_particle_generator"]
  #@config Electron with monokinetic energy @ 100 keV;group=non official
  particle_name : string = "electron"
  mode          : string = "monokinetic"
  randomized_direction : boolean = true
  energy        : real   = 100.0
  energy_unit   : string = "keV"

[name="electron.200keV" type="genbb::single_particle_generator"]
  #@config Electron with monokinetic energy @ 200 keV;group=non official
  particle_name : string = "electron"
  mode          : string = "monokinetic"
  randomized_direction : boolean = true
  energy        : real   = 200.0
  energy_unit   : string = "keV"
